<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="منظّم الجداول التدريبية: عدد الشعب، إسناد المقررات، الجدول المقترح، والجدول اليدوي.">
<title>ScheduleFlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Kufi+Arabic:wght@600;700&display=swap">
<style>
:root { padding-top:env(safe-area-inset-top, 0px); padding-bottom:env(safe-area-inset-bottom, 0px); }
body { margin:0; }
img { max-width:100%; }
[hidden] { display:none !important; }
</style>
<style>
/* Single light (white) theme by request. Layout: planning-board tool — header + tabs; page 1 = trainer cards over a sticky course tray; page 2 = days-as-rows timetable (time flows right→left) with a side panel */
:root, .force-light { color-scheme:light;
  --bg:#FFFFFF; --surface:#FFFFFF; --surface-2:#F0F3F2; --ink:#16201E; --muted:#5A6965; --line:#D2DAD7;
  --accent:#145C50; --accent-ink:#FFFFFF; --accent-soft:#D6EBE5;
  --ok:#2C7A4B; --warn:#A86300; --bad:#B4232C; --bad-soft:#FBE3E4;
  --chip-s:60%; --chip-l:91%; --chip-fg-l:22%; --chip-edge-l:72%;
  --font-display:"Noto Kufi Arabic", "IBM Plex Sans Arabic", Tahoma, sans-serif;
  --font-body:"IBM Plex Sans Arabic", "Segoe UI", Tahoma, system-ui, sans-serif;
  --r:8px;
}
body { background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:14px; line-height:1.55; }
.app { padding-left:max(16px, env(safe-area-inset-left, 0px)); padding-right:max(16px, env(safe-area-inset-right, 0px)); padding-block:16px 0; max-width:1500px; margin-inline:auto; }
h1,h2,h3 { font-family:var(--font-display); margin:0; text-wrap:balance; font-weight:700; }
button, input, select { font:inherit; color:inherit; }
button { cursor:pointer; }
:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
.num { font-variant-numeric:tabular-nums; }

/* header */
.top { display:flex; flex-wrap:wrap; align-items:center; gap:12px 20px; padding-bottom:14px; border-bottom:1px solid var(--line); }
.org-logo { height:52px; width:auto; background:transparent; }
@media (max-width:520px) { .org-logo { height:40px; } }
.brand { display:flex; align-items:center; gap:10px; }
.brand-mark { width:34px; height:34px; border-radius:8px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; }
.brand h1 { font-size:18px; letter-spacing:0; }
.brand small { display:block; color:var(--muted); font-size:12px; margin-top:-2px; }
.meta { display:flex; flex-wrap:wrap; gap:8px; color:var(--muted); font-size:13px; }
.pill { border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:3px 10px; white-space:nowrap; }
.pill.demo { border-color:var(--warn); color:var(--warn); }
.spacer { flex:1; }
.tabs { display:flex; gap:4px; background:var(--surface-2); padding:4px; border-radius:10px; }
.tab { border:0; background:transparent; padding:7px 16px; border-radius:7px; font-weight:600; color:var(--muted); display:flex; gap:8px; align-items:center; }
.tab[aria-selected="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgb(0 0 0 / .08); }
.tab .step { font-size:11px; width:20px; height:20px; border-radius:50%; display:grid; place-items:center; background:var(--line); color:var(--ink); }
.tab[aria-selected="true"] .step { background:var(--accent); color:var(--accent-ink); }
.btn { border:1px solid var(--line); background:var(--surface); padding:7px 14px; border-radius:var(--r); font-weight:500; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; }
.btn:hover { border-color:var(--muted); }
.btn.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.ghost { border-color:transparent; background:transparent; color:var(--muted); }
.btn svg { width:16px; height:16px; flex:none; }

/* summary strip */
.summary { display:flex; flex-wrap:wrap; gap:8px 28px; padding:14px 0; align-items:baseline; }
.stat { display:flex; gap:8px; align-items:baseline; }
.stat b { font-size:20px; font-family:var(--font-display); font-variant-numeric:tabular-nums; }
.stat span { color:var(--muted); font-size:13px; }
.stat.bad b { color:var(--bad); }
/* instructions on the right, figures on the left */
.summary > .hint { order:-2; max-width:60ch; }
.summary > .spacer { order:-1; }
.hint { color:var(--muted); font-size:13px; }

/* ---------- assignment page ---------- */
.cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(250px, 1fr)); gap:12px; padding-bottom:20px; }
.tcard { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; min-height:190px; transition:border-color .15s, background .15s; }
.tcard.over-drop { border-color:var(--accent); background:var(--accent-soft); }
.tcard-head { display:flex; justify-content:space-between; gap:8px; align-items:flex-start; }
.tname { font-weight:700; font-size:15px; }
.load { font-size:13px; color:var(--muted); }
.load b { color:var(--ink); font-size:15px; }
.load.full b { color:var(--ok); } .load.over b { color:var(--bad); }
.bar { height:6px; border-radius:3px; background:var(--surface-2); overflow:hidden; }
.bar i { display:block; height:100%; background:var(--accent); border-radius:3px; transition:width .25s; }
.bar.full i { background:var(--ok); } .bar.over i { background:var(--bad); }
.labrow { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
.labrow input { width:64px; padding:3px 8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); text-align:center; }
.drop-list { display:flex; flex-wrap:wrap; gap:6px; flex:1; align-content:flex-start; border-radius:8px; }
.drop-empty { color:var(--muted); font-size:12px; border:1px dashed var(--line); border-radius:8px; padding:14px; text-align:center; width:100%; }

.chip { --h:200; background:hsl(var(--h) var(--chip-s) var(--chip-l)); color:hsl(var(--h) 45% var(--chip-fg-l)); border:1px solid hsl(var(--h) 50% var(--chip-edge-l)); border-radius:7px; padding:4px 6px 4px 9px; font-size:12.5px; display:inline-flex; align-items:center; gap:6px; touch-action:none; cursor:grab; user-select:none; }
.chip .x { border:0; background:transparent; padding:0 3px; opacity:.6; font-size:15px; line-height:1; }
.chip .x:hover { opacity:1; }
.chip .g { opacity:.75; }
.chip .rmt { display:inline-flex; align-items:center; gap:4px; border:0; background:transparent; color:inherit; opacity:.6; font-size:10.5px; padding:0 2px; line-height:1.6; }
.chip .rmt i { width:18px; height:10px; border-radius:5px; border:1px solid currentColor; position:relative; flex:none; }
.chip .rmt i::after { content:""; position:absolute; top:1px; inset-inline-start:1px; width:6px; height:6px; border-radius:50%; background:currentColor; transition:inset-inline-start .15s; }
.chip .rmt:hover { opacity:1; }
.chip .rmt[aria-checked="true"] { opacity:1; font-weight:700; }
.chip .rmt[aria-checked="true"] i { background:currentColor; }
.chip .rmt[aria-checked="true"] i::after { inset-inline-start:9px; background:hsl(var(--h) var(--chip-s) var(--chip-l)); }
.rmt-hint { margin:-4px 0 0; font-size:11px; color:var(--muted); }
.block.ghost { opacity:.55; cursor:default; border-style:dotted; background-image:none; box-shadow:none; }
.spec-head { font-size:18px; padding-top:6px; border-bottom:2px solid var(--accent); padding-bottom:6px; scroll-margin-top:64px; }
.block.remote { border-style:dashed; }
.block.remote .b1::after { content:"عن بعد"; font-size:9.5px; font-weight:600; border:1px solid currentColor; border-radius:999px; padding:0 5px; opacity:.85; }

.tray { position:sticky; bottom:0; z-index:5; background:var(--bg); border-top:1px solid var(--line); padding-block:10px calc(12px + env(safe-area-inset-bottom, 0px)); }
.tray.over-drop { background:var(--accent-soft); }
.tray-head { display:flex; gap:12px; align-items:baseline; margin-bottom:8px; flex-wrap:wrap; }
.tray-head h2 { font-size:14px; }
.courses { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
.course { --h:200; flex:none; width:196px; background:hsl(var(--h) var(--chip-s) var(--chip-l)); color:hsl(var(--h) 45% var(--chip-fg-l)); border:1px solid hsl(var(--h) 50% var(--chip-edge-l)); border-radius:10px; padding:8px 10px; touch-action:none; cursor:grab; user-select:none; display:flex; flex-direction:column; gap:4px; }
.course.done { opacity:.55; }
.course .code { font-weight:700; font-size:13px; }
.course .cspec { font-size:11px; font-weight:600; opacity:.85; }
.course .cname { font-size:12px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.course .cmeta { display:flex; justify-content:space-between; align-items:center; font-size:11.5px; }
.stepper { display:inline-flex; align-items:center; gap:2px; background:rgb(255 255 255 / .35); border-radius:6px; }
.stepper button { border:0; background:transparent; width:20px; height:20px; border-radius:5px; font-weight:700; line-height:1; }
.stepper button:hover { background:rgb(0 0 0 / .08); }
.left { font-weight:600; }

/* ---------- schedule page ---------- */
.toolbar { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; padding:14px 0 6px; }
.seg { display:inline-flex; background:var(--surface-2); border-radius:9px; padding:3px; gap:2px; }
.seg button { border:0; background:transparent; padding:5px 12px; border-radius:7px; font-size:13px; color:var(--muted); font-weight:500; }
.seg button[aria-pressed="true"] { background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgb(0 0 0 / .08); }
.lbl { font-size:12px; color:var(--muted); }
select.sel { padding:5px 10px; border:1px solid var(--line); border-radius:7px; background:var(--surface); max-width:220px; }

.options { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px; padding:8px 0 12px; }
.opt { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px; }
.opt.applied { border-color:var(--accent); box-shadow:0 0 0 1px var(--accent); }
.opt-head { display:flex; justify-content:space-between; align-items:center; gap:8px; }
.opt h3 { font-size:15px; }
.opt p { margin:0; color:var(--muted); font-size:12.5px; }
.tag { font-size:11px; padding:2px 8px; border-radius:999px; background:var(--accent-soft); color:var(--accent); font-weight:600; }
.mets { display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
.met { background:var(--surface-2); border-radius:7px; padding:6px 8px; }
.met b { display:block; font-size:15px; font-variant-numeric:tabular-nums; }
.met span { font-size:11px; color:var(--muted); }
.met.bad b { color:var(--bad); }
.heat { display:grid; gap:2px; }
.heat i { height:9px; border-radius:2px; background:var(--surface-2); }

.workspace { display:grid; grid-template-columns:minmax(0,1fr) 290px; gap:14px; align-items:start; padding-bottom:28px; }
.side { display:flex; flex-direction:column; gap:12px; position:sticky; top:64px; }
.panel { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; }
.panel h3 { font-size:13.5px; display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
.count { font-family:var(--font-body); font-size:12px; min-width:22px; height:22px; border-radius:11px; display:inline-grid; place-items:center; padding-inline:6px; background:var(--surface-2); }
.count.bad { background:var(--bad); color:var(--surface); }
.unplaced { display:flex; flex-direction:column; gap:6px; min-height:56px; border-radius:8px; padding:2px; }
.unplaced.over-drop { background:var(--accent-soft); outline:1px dashed var(--accent); }
.unplaced .chip { justify-content:space-between; width:100%; padding:6px 9px; }
.conf-list { display:flex; flex-direction:column; gap:6px; max-height:340px; overflow:auto; }
.conf { text-align:start; border:1px solid var(--line); background:var(--bg); border-radius:8px; padding:7px 9px; display:flex; flex-direction:column; gap:2px; font-size:12.5px; }
.conf:hover { border-color:var(--bad); }
.conf strong { color:var(--bad); font-size:12.5px; }
.conf.warnc strong { color:var(--warn); }
.conf small { color:var(--muted); }
.ok-note { color:var(--ok); font-size:13px; }

.tt-wrap { overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px; }
.tt { --n:8; --lane-h:62px; --cols: 86px repeat(var(--n), minmax(104px, 1fr)); min-width:calc(86px + var(--n) * 104px); }
.tt.compact { --lane-h:44px; }
.tt-head, .tt-row { display:grid; grid-template-columns:var(--cols); }
.tt-head { background:var(--surface-2); font-size:12px; color:var(--muted); }
.tt-head div { padding:8px 6px; text-align:center; border-inline-start:1px solid var(--line); }
.tt-head div:first-child { border:0; }
.tt-head b { display:block; color:var(--ink); font-size:12.5px; font-variant-numeric:tabular-nums; }
.tt-row { grid-auto-rows:var(--lane-h); border-top:1px solid var(--line); padding-block:3px; }
.dayname { grid-column:1; grid-row:1 / -1; display:flex; align-items:center; justify-content:center; font-weight:700; font-family:var(--font-display); font-size:13px; margin-block:-3px; background:var(--surface-2); }
.cell { grid-row:1 / -1; border-inline-start:1px solid var(--line); margin-block:-3px; }
.cell.edge { border-inline-start-color:var(--muted); border-inline-start-style:dashed; }
.cell.brk { background:repeating-linear-gradient(135deg, transparent 0 6px, var(--surface-2) 6px 12px); }
.cell.hl { background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent); }
.brk-label { grid-row:1; align-self:center; text-align:center; font-size:11px; color:var(--muted); pointer-events:none; z-index:1; }
.block { --h:200; position:relative; z-index:2; margin:0 3px; background:hsl(var(--h) var(--chip-s) var(--chip-l)); color:hsl(var(--h) 45% var(--chip-fg-l)); border:1px solid hsl(var(--h) 50% var(--chip-edge-l)); border-radius:7px; padding:4px 8px 4px 14px; font-size:11.5px; line-height:1.35; overflow:hidden; touch-action:none; cursor:grab; user-select:none; display:flex; flex-direction:column; justify-content:center; min-width:0; }
.block .b1 { font-weight:700; font-size:12px; display:flex; gap:6px; align-items:center; white-space:nowrap; }
.block .b2, .block .b3 { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.85; }
.block.bad { box-shadow:inset 0 0 0 2px var(--bad); background-image:repeating-linear-gradient(135deg, transparent 0 7px, color-mix(in srgb, var(--bad) 16%, transparent) 7px 9px); }
.block.warn { border-style:dashed; border-color:var(--warn); }
.block.flash { animation:flash 1.2s ease 2; }
@keyframes flash { 50% { box-shadow:0 0 0 3px var(--accent); } }
.block .lock { border:0; background:transparent; padding:0; width:16px; height:16px; opacity:0; display:grid; place-items:center; margin-inline-start:auto; color:inherit; }
.block:hover .lock, .block.locked .lock { opacity:.9; }
.block .lock svg { width:13px; height:13px; }
.block .rz { position:absolute; inset-block:0; inset-inline-end:0; width:9px; cursor:ew-resize; touch-action:none; }
.block .rz::after { content:""; position:absolute; inset-block:30%; inset-inline-end:3px; width:2px; border-radius:1px; background:currentColor; opacity:.35; }
.block:hover .rz::after { opacity:.8; }
.badge-hours { font-size:10.5px; font-weight:600; opacity:.8; }

.dragging { opacity:.3; pointer-events:none; }
.ghost { position:fixed; z-index:100; pointer-events:none; top:0; left:0; opacity:.92; box-shadow:0 8px 24px rgb(0 0 0 / .22); transform-origin:center; }
body.is-dragging, body.is-dragging * { cursor:grabbing !important; }
body.is-resizing, body.is-resizing * { cursor:ew-resize !important; }

.toast { position:fixed; bottom:calc(24px + env(safe-area-inset-bottom, 0px)); left:50%; transform:translateX(-50%); background:var(--ink); color:var(--bg); padding:9px 16px; border-radius:9px; font-size:13px; z-index:200; max-width:calc(100vw - 32px); }

.legend { display:flex; flex-wrap:wrap; gap:14px; font-size:12px; color:var(--muted); padding:8px 2px 0; }
.legend span { display:inline-flex; align-items:center; gap:6px; }
.sw { width:14px; height:10px; border-radius:3px; display:inline-block; border:1px solid var(--line); }

/* ---------- counts page ---------- */
.levels { display:grid; grid-template-columns:repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap:14px; padding-bottom:24px; }
.lvl { background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:6px 14px 10px; }
.lvl h3 { font-size:14px; padding:10px 0 6px; display:flex; justify-content:space-between; align-items:baseline; }
.lvl h3 small { font-family:var(--font-body); font-weight:500; color:var(--muted); font-size:12px; }
.crow { --h:200; display:grid; grid-template-columns:12px minmax(0,1fr) auto auto 70px; gap:12px; align-items:center; padding:9px 0; border-top:1px solid var(--line); }
.crow .dot { width:12px; height:12px; border-radius:4px; background:hsl(var(--h) 50% var(--chip-edge-l)); }
.cinfo { min-width:0; display:flex; flex-direction:column; }
.cinfo b { font-size:13.5px; } .cinfo span { font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.cm { font-size:12px; color:var(--muted); white-space:nowrap; }
.cm.tot { text-align:end; color:var(--ink); font-weight:600; }
.bigstep { display:inline-flex; align-items:center; border:1px solid var(--line); border-radius:9px; overflow:hidden; background:var(--bg); }
.bigstep button { border:0; background:transparent; width:32px; height:34px; font-size:17px; font-weight:700; }
.bigstep button:hover { background:var(--surface-2); }
.bigstep input { width:46px; height:34px; border:0; border-inline:1px solid var(--line); background:var(--surface); text-align:center; font-size:16px; font-weight:700; -moz-appearance:textfield; }
.bigstep input::-webkit-inner-spin-button { -webkit-appearance:none; }
.next-row { display:flex; justify-content:flex-end; padding-bottom:28px; }
.course .remain { display:flex; align-items:baseline; gap:6px; }
.course .remain b { font-size:22px; font-family:var(--font-display); line-height:1.1; font-variant-numeric:tabular-nums; }
.course .remain span { font-size:11.5px; }
.course.empty { opacity:.45; cursor:not-allowed; }

/* ---------- manual page ---------- */
.tt.manual { --lane-h:88px; }
.tt.manual.mstatic { --lane-h:58px; }
.tt.manual .tt-row { padding-block:0; }
.tt.manual .dayname { margin-block:0; flex-direction:column; gap:6px; }
.lane-btns { display:flex; gap:4px; }
.lane-btns button { border:1px solid var(--line); background:var(--surface); border-radius:6px; font-size:11px; padding:1px 7px; font-family:var(--font-body); font-weight:500; }
.mcell { border-inline-start:1px solid var(--line); border-top:1px dotted var(--line); cursor:cell; }
.mcell:hover { background:var(--surface-2); }
.mcell.first { border-top:0; }
.mcell.hl { background:var(--accent-soft); box-shadow:inset 0 0 0 1px var(--accent); }
.mentry { --h:200; position:relative; z-index:2; margin:4px 3px; background:hsl(var(--h) var(--chip-s) var(--chip-l)); color:hsl(var(--h) 45% var(--chip-fg-l)); border:1px solid hsl(var(--h) 50% var(--chip-edge-l)); border-radius:7px; padding:3px 6px 5px 12px; display:flex; flex-direction:column; gap:3px; touch-action:none; cursor:grab; min-width:0; }
.mentry.plain { background:var(--surface); color:var(--ink); border-color:var(--muted); }
.mentry.bad { box-shadow:inset 0 0 0 2px var(--bad); }
.mentry.over-drop { outline:2px dashed var(--bad); }
.mgrip { display:flex; justify-content:space-between; align-items:center; font-size:10.5px; opacity:.8; user-select:none; }
.mgrip .x { border:0; background:transparent; font-size:15px; line-height:1; padding:0 2px; color:inherit; }
.mentry input { width:100%; min-width:0; border:1px solid transparent; background:rgb(255 255 255 / .45); border-radius:4px; padding:1px 5px; font-size:12px; color:inherit; }
.mentry.plain input { background:var(--bg); }
.mentry input:focus { border-color:currentColor; outline:none; background:var(--surface); }
.mentry input.mc { font-weight:700; }
.mline { display:flex; gap:3px; }
.mline input.lab { width:52px; flex:none; text-align:center; }
.mentry .rz { position:absolute; inset-block:0; inset-inline-end:0; width:9px; cursor:ew-resize; touch-action:none; }
.mentry .rz::after { content:""; position:absolute; inset-block:30%; inset-inline-end:3px; width:2px; border-radius:1px; background:currentColor; opacity:.4; }
.sentry { font-size:11.5px; line-height:1.4; }
.sentry b { display:block; font-size:12px; }
.levelnav { position:sticky; top:env(safe-area-inset-top, 0px); z-index:8; display:flex; gap:4px; overflow-x:auto; background:var(--bg); padding:8px 0; margin-bottom:6px; border-bottom:1px solid var(--line); }
.levelnav button { flex:none; border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:6px 14px; font-size:13px; font-weight:600; color:var(--muted); }
.levelnav button:hover { color:var(--ink); border-color:var(--muted); }
.levelnav button[aria-current="true"] { background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
.stack { display:flex; flex-direction:column; gap:26px; }
.lvl-block { scroll-margin-top:64px; display:flex; flex-direction:column; gap:8px; }
.lvl-head { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; padding-bottom:2px; }
.lvl-head h2 { font-size:17px; }
.mtitle { font-size:13.5px; margin:6px 0 0; color:var(--muted); }
.mtitle-row { display:flex; justify-content:space-between; align-items:center; }
.btn.sm { padding:3px 10px; font-size:12px; }
.mentry.flash { animation:flash 1.2s ease 2; }
.levelbar { display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center; padding:4px 0 12px; }
.models { display:flex; flex-wrap:wrap; gap:6px; }
.mchip { border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 14px; font-size:13px; font-weight:600; }
.mchip[aria-pressed="true"] { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.mchip.add { border-style:dashed; color:var(--muted); font-weight:500; }
.mchip.add:hover { color:var(--accent); border-color:var(--accent); }
.lvl-hint { margin:0 0 8px; }
.specpick { display:inline-flex; align-items:center; gap:0; border:1px solid var(--accent); border-radius:999px; overflow:hidden; background:var(--surface); }
.specpick span { background:var(--accent); color:var(--accent-ink); font-size:12px; font-weight:600; padding:4px 10px; }
.specpick select { border:0; background:transparent; padding:3px 8px; font-weight:600; font-size:13px; color:var(--ink); cursor:pointer; }
.seg button small { font-size:10.5px; opacity:.75; margin-inline-start:4px; }
.helpbtn { border:1px solid var(--line); background:var(--surface); color:var(--accent); border-radius:999px; padding:3px 12px; font-size:13px; font-weight:600; }
.helpbtn:hover, .helpbtn[aria-pressed="true"] { background:var(--accent-soft); border-color:var(--accent); }
.help { display:grid; grid-template-columns:220px minmax(0,1fr); gap:28px; padding-block:20px 40px; align-items:start; }
.help-toc { position:sticky; top:12px; display:flex; flex-direction:column; gap:2px; border-inline-start:2px solid var(--line); }
.help-toc a { color:var(--muted); text-decoration:none; padding:6px 12px; font-size:13.5px; display:flex; gap:8px; align-items:center; margin-inline-start:-2px; border-inline-start:2px solid transparent; }
.help-toc a:hover { color:var(--accent); border-inline-start-color:var(--accent); }
.help-toc .num, .help-sec h3 .num { font-size:11px; width:20px; height:20px; border-radius:50%; background:var(--surface-2); display:inline-grid; place-items:center; flex:none; color:var(--ink); }
.help-body { max-width:72ch; display:flex; flex-direction:column; gap:22px; }
.help-intro { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.help-intro h2 { font-size:22px; }
.help-sec { scroll-margin-top:16px; border-top:1px solid var(--line); padding-top:16px; }
.help-sec h3 { font-size:16px; display:flex; gap:10px; align-items:center; margin-bottom:8px; }
.help-sec h3 .num { background:var(--accent); color:var(--accent-ink); }
.help-sec p { margin:0 0 8px; }
.help-note { margin-top:12px; background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px; padding:12px 14px; }
.help-note > b { display:block; margin-bottom:6px; color:var(--accent); }
.help-sec ul { margin:0; padding-inline-start:20px; display:flex; flex-direction:column; gap:6px; }
.help-sec li { line-height:1.75; }
@media (max-width:760px) { .help { grid-template-columns:minmax(0,1fr); } .help-toc { position:static; } }
.backup { display:flex; gap:6px; }
.backup label.btn { cursor:pointer; }
.btn.reset { color:var(--bad); }
.btn.reset:hover { border-color:var(--bad); background:var(--bad-soft); }
.restore-bar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; background:var(--accent-soft); border:1px solid var(--accent); border-radius:10px; padding:10px 14px; margin-top:12px; }
.restore-bar span { flex:1 1 240px; }
.restore-bar.warn { background:var(--bad-soft); border-color:var(--bad); }
.btn.danger { background:var(--bad); border-color:var(--bad); color:#fff; }
.tabs { flex-wrap:wrap; }
.empty-state { background:var(--surface); border:1px dashed var(--line); border-radius:12px; padding:40px 20px; margin-block:20px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; }
.empty-state h2 { font-size:17px; }
.empty-state p { margin:0; max-width:52ch; }

.tcard.ext { border-style:solid; background:linear-gradient(var(--surface), var(--surface)) padding-box; }
.dept { display:inline-block; font-size:11px; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:1px 8px; margin-top:3px; }
.tright { display:flex; align-items:flex-start; gap:4px; }
.hrs { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
.hbox { background:var(--surface-2); border-radius:8px; padding:6px 9px; display:flex; flex-direction:column; }
.hbox span { font-size:11px; color:var(--muted); }
.hbox b { font-size:18px; font-family:var(--font-display); line-height:1.3; }
.hbox b small { font-size:12px; color:var(--muted); font-family:var(--font-body); font-weight:500; }
.hbox em { font-style:normal; font-size:11px; color:var(--muted); }
.hbox.full b { color:var(--ok); } .hbox.over b { color:var(--bad); } .hbox.over em { color:var(--bad); }
.x.rm { border:0; background:transparent; font-size:17px; line-height:1; color:var(--muted); padding:0 2px; }
.x.rm:hover { color:var(--bad); }
.addcard { border:1.5px dashed var(--line); background:transparent; align-items:center; justify-content:center; text-align:center; color:var(--muted); gap:4px; font:inherit; }
.addcard:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-soft); }
.addcard .plus { font-size:34px; line-height:1; font-weight:300; }
.addcard b { color:var(--ink); font-size:14px; }
.overlay { position:fixed; inset:0; z-index:60; background:rgb(10 20 18 / .45); display:grid; place-items:center; padding:16px; }
.picker { background:var(--surface); border:1px solid var(--line); border-radius:14px; width:min(520px, 100%); max-height:min(640px, 86vh); display:flex; flex-direction:column; gap:10px; padding:16px; box-shadow:0 18px 50px rgb(0 0 0 / .25); }
.phead { display:flex; justify-content:space-between; align-items:center; }
.phead h2 { font-size:16px; }
.phead .x { border:0; background:transparent; font-size:22px; line-height:1; color:var(--muted); }
.psearch, .pnew input { padding:8px 10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); min-width:0; }
.plist { overflow:auto; display:flex; flex-direction:column; gap:12px; min-height:80px; }
.pgroup h4 { margin:0 0 4px; font-size:12px; color:var(--muted); font-weight:600; }
.pitem { width:100%; display:flex; justify-content:space-between; align-items:center; border:1px solid transparent; background:transparent; padding:8px 10px; border-radius:8px; text-align:start; }
.pitem + .pitem { border-top-color:var(--line); border-radius:0; }
.pitem:hover { background:var(--accent-soft); border-color:var(--accent); border-radius:8px; }
.pitem:hover .hint { color:var(--accent); }
.pnew { display:flex; flex-wrap:wrap; gap:6px; align-items:center; border-top:1px solid var(--line); padding-top:10px; }
.pnew input { flex:1 1 120px; }
.ctag.gs { border-color:var(--accent); color:var(--accent); }
.ctag { display:inline-block; font-size:10.5px; border:1px solid var(--line); border-radius:999px; padding:0 7px; margin-inline-start:6px; color:var(--muted); font-weight:500; }
.tray-head .seg button { padding:3px 10px; font-size:12px; }

@media (max-width: 980px) {
  .workspace { grid-template-columns:minmax(0,1fr); }
  .side { position:static; }
  .options { grid-template-columns:minmax(0,1fr); }
}
@media (max-width: 520px) {
  .tabs { width:100%; } .tab { flex:1; justify-content:center; padding-inline:8px; }
  .mets { grid-template-columns:repeat(2, 1fr); }
}
@media (prefers-reduced-motion: reduce) { * { transition:none !important; animation:none !important; } }
</style>

    const i = info(s); const tid = i.t ? i.t.id : '-';
    (byT[tid] ??= {}); (byT[tid][s.day] ??= []); (byG[i.gk] ??= {}); (byG[i.gk][s.day] ??= []);
    for (let k = s.start; k < s.start + s.len; k++) { byT[tid][s.day].push(k); byG[i.gk][s.day].push(k); hours++; if (k < noon) morning++; dayLoad[s.day]++; }
  });
  let days = 0, gaps = 0, maxDay = 0; const tids = Object.keys(byT);
  tids.forEach(t => Object.values(byT[t]).forEach(ks => { days++; maxDay = Math.max(maxDay, ks.length); }));
  Object.values(byG).forEach(g => Object.values(g).forEach(ks => { gaps += (Math.max(...ks) - Math.min(...ks) + 1) - new Set(ks).size; }));
  const mean = dayLoad.reduce((a,b) => a+b, 0) / 5;
  const sd = Math.sqrt(dayLoad.reduce((a,b) => a + (b-mean)**2, 0) / 5);
  return { placed:placed.length, total:sol.length, avgDays: tids.length ? days / tids.length : 0, gaps, maxDay, morning: hours ? Math.round(morning * 100 / hours) : 0, sd, dayLoad };
}

function generate(strategy, attempts = 36) {
  const tp = tpl(), n = tp.n, br = new Set(tp.breaks);
  const infos = {}; S.sessions.forEach(s => { infos[s.id] = info(s); });
  const foreign = foreignSessions().map(s => ({ s, i:info(s) }));
  // once placed (usually from الدراسات العامة), a general-studies lecture stays put when a specialisation regenerates
  const fixed = s => s.locked || (!S.isGS && infos[s.id].gs && s.day != null);
  const loads = {}; S.trainers.forEach(t => { loads[t.id] = trainerLoad(t); });
  let best = null;
  for (let a = 0; a < attempts; a++) {
    const rng = mulberry32(a * 7919 + strategy.length * 101 + 17);
    const sol = S.sessions.map(s => (fixed(s) && s.day != null) ? { ...s } : (fixed(s) ? { ...s, _skip:true } : { ...s, day:null, start:null }));
    const occ = new Set(), tDays = {}, dayLoad = [0,0,0,0,0], tDayLoad = {}, secDays = {};
    const keys = i => [i.tkey && 't'+i.tkey, i.rkey && 'r'+i.rkey, 'g'+i.gk].filter(Boolean);
    const mark = (i, len, d, st) => { const tid = i.tkey || '-'; keys(i).forEach(k => { for (let t = st; t < st + len; t++) occ.add(k+'|'+d+'|'+t); }); (tDays[tid] ??= new Set()).add(d); tDayLoad[tid+'|'+d] = (tDayLoad[tid+'|'+d] || 0) + len; };
    foreign.forEach(({ s, i }) => mark(i, s.len, s.day, s.start));
    const place = (s, d, st) => {
      s.day = d; s.start = st; const i = infos[s.id], tid = i.tkey || '-';
      keys(i).forEach(k => { for (let t = st; t < st + s.len; t++) occ.add(k+'|'+d+'|'+t); });
      (tDays[tid] ??= new Set()).add(d); dayLoad[d] += s.len; tDayLoad[tid+'|'+d] = (tDayLoad[tid+'|'+d] || 0) + s.len;
      (secDays[s.sectionId] ??= new Set()).add(d);
    };
    sol.filter(s => s.day != null).forEach(s => place(s, s.day, s.start));
    const todo = sol.filter(s => s.day == null && !s._skip).map(s => ({ s, r:rng() }))
      .sort((x,y) => (y.s.len - x.s.len) || ((loads[infos[y.s.id].t?.id] || 0) - (loads[infos[x.s.id].t?.id] || 0)) * (0.6 + x.r * 0.4) || x.r - y.r)
      .map(o => o.s);
    for (const s of todo) {
      const i = infos[s.id], ks = keys(i), tid = i.tkey || '-';
      let bc = null, bs = Infinity;
      for (let d = 0; d < 5; d++) {
        let gmin = Infinity, gmax = -Infinity; const gk = 'g' + i.gk;
        for (let t = 0; t < n; t++) if (occ.has(gk+'|'+d+'|'+t)) { gmin = Math.min(gmin, t); gmax = Math.max(gmax, t); }
        const tLoad = tDayLoad[tid+'|'+d] || 0;
        for (let st = 0; st + s.len <= n; st++) {
          let ok = true;
          for (let t = st; t < st + s.len && ok; t++) { if (br.has(t)) ok = false; else for (const k of ks) if (occ.has(k+'|'+d+'|'+t)) { ok = false; break; } }
          if (!ok) continue;
          const end = st + s.len - 1;
          const ggap = gmin === Infinity ? 0 : (st > gmax ? st - gmax - 1 : (end < gmin ? gmin - end - 1 : 0));
          // every strategy spreads each trainer across Sun–Thu: heavy days cost, a 7th+ hour in one day costs a lot
          let sc = rng() * 3 + (secDays[s.sectionId]?.has(d) ? 40 : 0) + tLoad * 7 + (tLoad + s.len > 6 ? 60 : 0);
          if (strategy === 'balanced') sc += dayLoad[d] * 1.6 + ggap * 2 + Math.abs(st - n * 0.3) * 0.5;
          else if (strategy === 'trainees') sc += ggap * 9 + (gmin === Infinity ? 0 : -4) + st * 0.6;
          else sc += (st + s.len) * 6 + ggap * 2;
          if (sc < bs) { bs = sc; bc = [d, st]; }
        }
      }
      if (bc) place(s, bc[0], bc[1]);
    }
    const m = metrics(sol.filter(x => !x._skip));
    const obj = (m.total - m.placed) * 1000 + m.maxDay * 15 - m.avgDays * 20 + (strategy === 'balanced' ? m.sd * 12 + m.gaps * 3 : strategy === 'trainees' ? m.gaps * 12 : (100 - m.morning) * 2 + m.gaps * 3);
    if (!best || obj < best.obj) best = { obj, sol, m };
  }
  return best;
}

function gridHtml(C, filter = inView, gkey = '', ghosts = []) {
  const tp = tpl(), n = tp.n;
  const list = S.sessions.filter(s => s.day != null && filter(s));
  let head = `<div class="tt-head"><div></div>${Array.from({length:n}, (_,i) => `<div><b>${pStart(i)}</b>${pEnd(i)}</div>`).join('')}</div>`;
  const rows = DAYS.map((d, di) => {
    const items = list.filter(s => s.day === di).map(s => ({ s })).concat(ghosts.filter(s => s.day === di).map(s => ({ s, ghost:true })))
      .sort((a,b) => a.s.start - b.s.start || b.s.len - a.s.len);
    const lanes = [];
    items.forEach(o => { let l = lanes.findIndex(end => end <= o.s.start); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = o.s.start + o.s.len; o.lane = l; if (!o.ghost) o.s._lane = l; });
    const L = Math.max(1, lanes.length);
    const cells = Array.from({length:n}, (_,k) => `<div class="cell ${k % 2 === 0 && k ? 'edge' : ''}" style="grid-column:${k + 2}" data-drop="cell" data-g="${gkey}" data-day="${di}" data-slot="${k}"></div>`).join('');
    return `<div class="tt-row" style="grid-template-rows:repeat(${L}, var(--lane-h))"><div class="dayname">${d}</div>${cells}${items.map(o => o.ghost ? ghostHtml(o.s, o.lane) : blockHtml(o.s, C)).join('')}</div>`;
  }).join('');
  return `<div class="tt ${S.view.type === 'all' ? 'compact' : ''}" style="--n:${n}" data-grid="${gkey}">${head}${rows}</div>`;
}

function heatHtml(m) {

function optHeat(o) {

function addModel(L) {
  const cs = S.courses.filter(c => c.level === L);
  if (!cs.length) return toast(`لا توجد مقررات لـ${LV[L]} في الخطة التدريبية`);
  const n = Math.max(0, ...S.sections.filter(s => course(s.courseId).level === L).map(s => s.n)) + 1;
  if (n > MAXSEC) return toast(`الحد الأعلى ${MAXSEC} نماذج للمستوى في هذا النموذج الأولي`);
  cs.forEach(c => { if (!S.sections.some(s => s.courseId === c.id && s.n === n)) S.sections.push({ id:c.id + 's' + n, courseId:c.id, n, trainerId:null }); });
  S.sections.sort((a,b) => courseOrder(a.courseId) - courseOrder(b.courseId) || a.n - b.n);
  S.view.type = 'level'; (S.view.sel ||= {})[L] = LETTERS[n-1];
  syncSessions(); invalidate(); save(); render();

}
function rmModel(L) {
  const secs = S.sections.filter(s => course(s.courseId).level === L), n = Math.max(...secs.map(s => s.n));
  const last = secs.filter(s => s.n === n);
  if (last.some(s => s.trainerId)) return toast(`نموذج ${LETTERS[n-1]} فيه شعب مُسندة. ألغي إسنادها أولاً`);
  S.sections = S.sections.filter(s => !last.includes(s));
  (S.view.sel ||= {})[L] = LETTERS[Math.max(0, n-2)];
  syncSessions(); invalidate(); save(); render();
}

/* ---------------- page 1: section counts ---------------- */
function setCount(cid, target) {
  const owner = course(cid).spec;
  if (S.isGS) { inSpec(owner, () => setCountCore(cid, target)); ROOT.specs[owner].options = null; S = buildGS(); }
  else setCountCore(cid, target);
  syncSessions(); invalidate(); save(); render();
}
function setCountCore(cid, target) {
  const c = course(cid); target = Math.max(0, Math.min(MAXSEC, target));
  let secs = S.sections.filter(s => s.courseId === cid);
  if (target > secs.length) {
    const used = new Set(secs.map(s => s.n));
    for (let k = 1; secs.length < target; k++) if (!used.has(k)) { const sec = { id:cid + 's' + k, courseId:cid, n:k, trainerId:null }; S.sections.push(sec); secs.push(sec); used.add(k); }
    if (target === MAXSEC) toast(`الحد الأعلى ${MAXSEC} شعبة للمقرر في هذا النموذج`);
  } else {
    let blocked = false;
    while (secs.length > target) {
      const free = secs.filter(s => !s.trainerId).sort((a,b) => b.n - a.n)[0];
      if (!free) { blocked = true; break; }
      S.sections = S.sections.filter(s => s !== free); secs = secs.filter(s => s !== free);
    }
    if (blocked) toast(`لا يمكن النزول عن ${secs.length}: هذه الشعب مُسندة لمدربات. ألغي الإسناد أولاً`);
  }
  S.sections.sort((a,b) => courseOrder(a.courseId) - courseOrder(b.courseId) || a.n - b.n);
}

const mSplit = key => { const i = key.lastIndexOf('-'), lk = key.slice(0, i), m = key.slice(i + 1); const [spec, L] = lk.includes('~') ? lk.split('~') : [null, lk]; return { lk, m, spec, L:+L }; };
const lkTitle = lk => { const [spec, L] = lk.includes('~') ? lk.split('~') : [null, lk]; return `${spec ? SPECS[spec] + ' — ' : ''}${LV[L]}`; };
const mTitle = key => { const p = mSplit(key); return `${lkTitle(p.lk)} — نموذج ${p.m}`; };
const mLanes = key => (M().lanes[key] ||= [1,1,1,1,1]);
const mModels = lk => (M().models[lk] ||= (String(lk).includes('~') ? (() => { const [sp, L] = lk.split('~'); const ms = levelModels(+L, sp); return ms.length ? ms : ['أ']; })() : ['أ']));
function mShown(L) { const ms = mModels(L); let m = (M().sel ||= {})[L] || ms[0]; if (m !== 'all' && !ms.includes(m)) m = ms[0]; return { ms, m, list: m === 'all' ? ms : [m] }; }
function mCourse(e) { const v = String(e.course || '').trim(); if (!v) return null; return S.courses.find(c => v === c.code || v.startsWith(c.code) || v === c.name) || null; }
function mFree(sheet, day, lane, start, len, exceptId) {

function mConflicts() {

    const when = `${DAYS[A.day]} ${pStart(Math.max(A.start, B.start))}`;

    if (norm(A.trainer) && norm(A.trainer) === norm(B.trainer)) { list.push({ title:'تعارض في المدربة', text:`أ. ${norm(A.trainer)} في مكانين بالوقت نفسه`, where, when, sheet:A.sheet, ids:[A.id,B.id] }); bad.add(A.id); bad.add(B.id); }

      });
      const ws = X.utils.aoa_to_sheet(aoa); ws['!merges'] = merges; ws['!cols'] = [{ wch:10 }, ...Array(n).fill({ wch:28 })];
      X.utils.book_append_sheet(wb, ws, sheetName(mGroupLabel(k, vt), used));
    });
    if (!wb.SheetNames.length) return toast('لا يوجد ما يُحفظ في هذا العرض بعد');
    const buf = X.write(wb, { bookType:'xlsx', type:'array' });
    return offerFile(`ScheduleFlow-الجدول-اليدوي-${vt === 'trainer' ? 'المدربات' : 'المعامل'}.xlsx`, new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
  }
  const keys = [...new Set(M().entries.map(e => e.sheet))].sort((a,b) => a.localeCompare(b, 'ar'));
  keys.forEach(key => {
    const lanes = mLanes(key);
    const aoa = [[mTitle(key)], ['اليوم', ...Array.from({length:n}, (_,k) => `${pStart(k)} - ${pEnd(k)}`)]], merges = [{ s:{ r:0, c:0 }, e:{ r:0, c:n } }];
    DAYS.forEach((d, di) => {
      const L = lanes[di], r0 = aoa.length;
      for (let l = 0; l < L; l++) {
        const row = [l ? '' : d, ...Array(n).fill('')];
        M().entries.filter(e => e.sheet === key && e.day === di && e.lane === l).forEach(e => {
          const c = mCourse(e);
          row[1 + e.start] = [e.course + (c ? ' ' + c.name : ''), e.trainer ? 'أ. ' + norm(e.trainer) : '', e.lab ? (String(e.lab).trim() === REMOTE ? REMOTE : 'معمل ' + e.lab) : ''].filter(Boolean).join(' | ');
          if (e.len > 1) merges.push({ s:{ r:aoa.length, c:1 + e.start }, e:{ r:aoa.length, c:e.start + e.len } });
        });
        aoa.push(row);
      }
      if (L > 1) merges.push({ s:{ r:r0, c:0 }, e:{ r:r0 + L - 1, c:0 } });
    });
    const ws = X.utils.aoa_to_sheet(aoa); ws['!merges'] = merges; ws['!cols'] = [{ wch:10 }, ...Array(n).fill({ wch:28 })];
    const p = mSplit(key);
    X.utils.book_append_sheet(wb, ws, sheetName(`${p.spec ? SPECS[p.spec].split(' ')[0] + ' ' : ''}م${p.L} نموذج ${p.m}`, used));
  });
  const buf = X.write(wb, { bookType:'xlsx', type:'array' });
  await offerFile('ScheduleFlow-الجدول-اليدوي-المستويات.xlsx', new Blob([buf], { type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' }));
}

/* ---------------- boot ---------------- */
syncSessions();
if (S.options && S.options.some(o => !STRATS[o.key])) { S.options = null; if (!STRATS[S.applied]) S.applied = null; }
autoGenerate();
save();
render();
})();
</script>
